[package]
name = "docker"
version = "0.1.0"
edition = "2024"
description = "Adapts Docker Engine + Compose into orca's containers domain"

[package.metadata.orca]
category = "infra"

[lib]
name = "docker"
path = "src/lib.rs"
# `rlib` retains the in-crate `#[cfg(test)]` harness + lets the workspace use it
# as a normal Rust lib.
crate-type = ["rlib"]

# A subprocess plugin is an executable, not a cdylib: orca's boot-time scan
# spawns it and speaks the UDS wire protocol to it.
[[bin]]
name = "docker"
path = "src/main.rs"

# Docker engine + compose adapter plugin for orca. CLI-based: the `docker`
# binary is the API. Three layers — engine (colima/desktop probe + lifecycle),
# compose (project wrapper), containers (ps/stats/inspect) — plus a flat
# `docker.{list,detail,create,update,delete}` tool surface and the
# `docker.{install,engine_update,backup,restore}` lifecycle tools.

# The orca surface (serde, serde_json, schemars, clap, anyhow + the reactor
# seams `process`/`io`/`time` + the containers/db/contract domains) is reached
# through `plugin_toolkit::*` / its prelude — the plugin names no async runtime
# or time crate itself. The plugin owns its DOMAIN-SPECIFIC deps directly —
# bollard is the Docker Engine client, which per the plugin model lives HERE,
# not in orca core (orca's `containers` crate is now a bollard-free generic
# seam).
#
# Pinned to the orca git source; the committed `[patch]` in `.cargo/config.toml`
# resolves this to the local in-tree toolkit alongside a checked-out orca repo.
[dependencies]
# Thin profile: docker talks to the engine via bollard (its own dep), not
# HTTP-over-toolkit, so no `http`/`delegated-http`. It needs `tools`
# (#[orca_tool]), `db` (endpoint_resource! + db_op routed through core's one
# connection), and `containers` (the RuntimeAdapter seam) — nothing else.
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", tag = "v0.1.7-rc.1", default-features = false, features = ["tools", "db", "containers"] }

# The ONE domain dep this plugin owns: the Docker Engine client. Everything else
# — reactor, process, io, stream, time — comes from orca's generic seams, so
# docker names no tokio/futures/chrono. This is what "the docker plugin owns
# bollard" means: the concrete engine client rides with the plugin, orca stays
# generic.
bollard = { version = "0.21", default-features = false, features = ["pipe"] }

[dev-dependencies]
# Dev-only: in-crate tests reach the toolkit's seams (serde, `reactor::block_on`)
# the same way the lib does. Not a runtime dep.
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", tag = "v0.1.7-rc.1", default-features = false, features = ["tools", "db", "containers"] }
tempfile = "3"

# Match orca's workspace lint floor: discarding a Result/Option via
# `let _ = ...` stays a hard error so the plugin remains portable back into the
# orca workspace.
[lints.clippy]
let_underscore_must_use = "deny"
