name: Lint scripts

# The docker plugin has no container image of its own — it manages docker on a
# host (see README "Deploy"). This workflow shellchecks the lifecycle scripts
# the install/update/backup tools orchestrate whenever they change.

on:
  push:
    branches: [dev, stage, main]
    paths:
      - scripts/**
      - .github/workflows/build.yml
  pull_request:
    branches: [dev, main]
    paths:
      - scripts/**

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
